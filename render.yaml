# Free API only. Provision MySQL separately using Aiven's Free plan.
# Apply migrations and bootstrap the first admin before the initial deploy.
services:
  - type: web
    name: supply-chain-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeployTrigger: 'off'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DB_REQUIRE_TLS
        value: 'true'
      - key: DB_SSL_CA
        value: /etc/secrets/mysql-ca.pem
      - key: DB_POOL_SIZE
        value: '3'
      - key: DB_MAX_OVERFLOW
        value: '2'
      - key: SCHEDULER_ENABLED
        value: 'false'
