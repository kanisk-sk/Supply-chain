name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ENVIRONMENT: test
      DATABASE_URL: mysql+pymysql://root:test-only-password@127.0.0.1:3306/supply_chain_runtime_test
      TEST_DATABASE_URL: mysql+pymysql://root:test-only-password@127.0.0.1:3306/supply_chain_ci_test
      JWT_SECRET: ci-test-secret-not-for-production-1234567890
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create disposable schemas
        run: |
          python - <<'PY'
          import pymysql
          with pymysql.connect(host='127.0.0.1', user='root', password='test-only-password') as conn:
              with conn.cursor() as cursor:
                  for name in ('supply_chain_runtime_test', 'supply_chain_ci_test'):
                      cursor.execute(f'CREATE DATABASE {name} CHARACTER SET utf8mb4')
          PY
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest tests --require-db -q
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
