name: Production overdue alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
concurrency:
  group: production-overdue-alerts
  cancel-in-progress: false
jobs:
  evaluate:
    # Opt in only after the live database and secrets are configured.
    # Standard public-repository runners are free; skip private repos.
    if: vars.FREE_SCHEDULER_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Reconcile overdue shipments
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CORS_ORIGINS: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
          DB_REQUIRE_TLS: 'true'
          MYSQL_CA_PEM: ${{ secrets.PRODUCTION_MYSQL_CA_PEM }}
          SCHEDULER_ENABLED: 'false'
          DB_POOL_SIZE: '2'
          DB_MAX_OVERFLOW: '0'
        run: |
          umask 077
          # This job never signs user tokens; keep the API signing key out of CI.
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export DB_SSL_CA="$RUNNER_TEMP/mysql-ca.pem"
          trap 'rm -f "$DB_SSL_CA"' EXIT
          python - <<'PY'
          import os
          from pathlib import Path
          certificate = os.environ['MYSQL_CA_PEM']
          if not certificate.startswith('-----BEGIN CERTIFICATE-----'):
              raise SystemExit('A valid production MySQL CA certificate is required.')
          Path(os.environ['DB_SSL_CA']).write_text(certificate)
          PY
          unset MYSQL_CA_PEM
          python -m app.jobs.scheduler --once
